  try { list = await Store.dOpen('battles'); } catch (e) { console.warn(e); toast('No se pudo buscar rivales.'); return; }
  const now = Date.now(); list = list.filter(b => b.estado === 'esperando' && !b.B && b.A.code !== d.code && now - (b.creado || 0) < 1800000);
  s.busy = true;
  openModal(`${mhead('⚔️', 'Buscar rival')}<div class="mbody">
    <div class="list">${list.map(b => { const a = areaById(b.area); return `<div class="rcard"><div><p>${esc(b.A.nombre)} <span class="mute">· ${b.A.miembros.length} integrantes · ${b.grado}°</span></p><span class="tag">${a.emoji} ${esc(a.nombre)}</span><span class="tag">${b.pregs.length} preguntas</span></div><div><button class="btn sm coral" data-m="btUnir" data-id="${esc(b.id)}">¡Luchar!</button></div></div>`; }).join('') || '<p class="mute">No hay equipos esperando ahora. Crea tu batalla y comparte el código con otro equipo.</p>'}</div>
    <div class="row" style="align-items:end"><div><label for="btCod">¿Tienes un código?</label><input id="btCod" maxlength="6" autocomplete="off" placeholder="Ej. K7QX2" style="text-transform:uppercase"></div><button class="btn" data-m="btCodigo" style="flex:0 0 auto">Entrar</button></div>
    <button class="btn alt" data-m="btVolver">Volver al equipo</button></div>`, { color: '#ffd6d6' });
}
async function btJoin(id) {
  const s = S.team, d = s && s.data; id = String(id || '').trim().toUpperCase();
  if (!d) return; if (id.length < 4) { toast('Escribe el código de la batalla.'); return; }
  if (d.batalla) { toast('Tu equipo ya tiene una batalla.'); return; }
  let r;
  try {
    r = await Store.dMut('battles', id, b => {
      if (b.estado !== 'esperando' || b.B) return { error: 'Esa batalla ya no está disponible.' };
      if (b.A.code === d.code) return { error: 'No puedes pelear contra tu propio equipo.' };
      b.B = btInfo(d); b.estado = 'listo';
    });
    if (r.error) { toast(r.error === 'No existe.' ? 'No existe una batalla con ese código.' : r.error); return; }
    await Store.teamPatch(d.code, { batalla: id });
  } catch (e) { console.error(e); toast('No se pudo unir a la batalla.'); return; }
  s.busy = false; btStart(id);
}
function btStart(id) {
  btStop();
  const bt = S.battle = { id, data: null, unsub: null, tmr: null, lastHp: null, starting: false, advKey: -1, cleared: false, reward: null, sending: false };
  openModal(`${mhead('⚔️', 'Batalla')}<div class="mbody"><p class="mute">Cargando…</p></div>`, { color: '#ffd6d6' });
  bt.unsub = Store.dWatch('battles', id, d => { if (S.battle !== bt) return; bt.data = d; renderBattle(); });
  bt.tmr = setInterval(btTick, 500);
}
function btStop() { const bt = S.battle; if (!bt) return; if (bt.unsub) bt.unsub(); clearInterval(bt.tmr); S.battle = null; }
function btBack() { btStop(); if (S.team) { S.team.busy = false; renderTeam(); } else closeModal(); }
async function btCancel() {
  const bt = S.battle; if (!bt || !bt.data) return; const b = bt.data;
  try { await Store.dDelete('battles', b.id); await Store.teamPatch(b.A.code, { batalla: null }); } catch (e) { console.warn(e); }
}
function btTick() {
  const bt = S.battle; if (!bt || !bt.data) return; const b = bt.data, me = S.me, side = btSide(b); if (!side) return;
  if (b.estado === 'listo' && b.host === me.id && !bt.starting) {
    bt.starting = true; setTimeout(() => { if (S.battle === bt) Store.dPatch('battles', b.id, { estado: 'jugando', t0: Date.now(), i: 0 }).catch(() => {}); }, 3000);
  }
  if (b.estado === 'jugando') {
    const left = Math.max(0, BT_SECS - Math.floor((Date.now() - b.t0) / 1000)), el = $('#btTmr'); if (el) el.textContent = left;
    const resp = (b.resp && b.resp['q' + b.i]) || {}, todos = b.A.miembros.concat(b.B.miembros), done = todos.every(m => resp[m.k]);
    if (b.host === me.id && bt.advKey !== b.i && (left <= 0 || (done && Date.now() - b.t0 > 1500))) { bt.advKey = b.i; setTimeout(() => { if (S.battle === bt) btAdvance(); }, done && left > 0 ? 1800 : 0); }
    const btn = $('#btSkip'); if (btn) btn.hidden = Date.now() - b.t0 < (BT_SECS + 15) * 1000;
  }
  if (b.estado === 'fin' && !bt.cleared && b[side].lider === me.id) { bt.cleared = true; Store.teamPatch(b[side].code, { batalla: null }).catch(() => {}); }
}
async function btAdvance() {
  const bt = S.battle; if (!bt || !bt.data) return; const i = bt.data.i;
  try {
    await Store.dMut('battles', bt.id, b => {
      if (b.estado !== 'jugando' || b.i !== i) return { error: 'ya avanzó' };
      const resp = (b.resp && b.resp['q' + i]) || {}, cnt = t => t.miembros.filter(m => resp[m.k] && resp[m.k].ok).length;
      const cA = cnt(b.A), cB = cnt(b.B), nA = b.A.miembros.length, nB = b.B.miembros.length;
      const dmgB = Math.round(cA / nA * 20) + (cA === nA ? 5 : 0), dmgA = Math.round(cB / nB * 20) + (cB === nB ? 5 : 0);
      b.B.hp = Math.max(0, b.B.hp - dmgB); b.A.hp = Math.max(0, b.A.hp - dmgA);
      b.rondas = b.rondas || {}; b.rondas['q' + i] = { a: dmgA, b: dmgB };
      b.i = i + 1; b.t0 = Date.now();
      if (b.i >= b.pregs.length || b.A.hp <= 0 || b.B.hp <= 0) { b.estado = 'fin'; b.ganador = b.A.hp > b.B.hp ? 'A' : (b.B.hp > b.A.hp ? 'B' : 'E'); }
    });
  } catch (e) { console.warn(e); }
}
async function btAnswer(val) {
  const bt = S.battle; if (!bt || !bt.data || bt.sending) return; const b = bt.data, me = S.me, side = btSide(b), mem = side && btMe(b, side), q = b.pregs[b.i];
  if (b.estado !== 'jugando' || !mem || !q) return;
  if (b.resp && b.resp['q' + b.i] && b.resp['q' + b.i][mem.k]) return;
  if (q.tipo === 'num' && isNaN(parseFloat(String(val).replace(',', '.')))) { toast('Escribe un número.'); return; }
  const v = q.tipo === 'mcq' ? +val : q.tipo === 'vf' ? val === 'true' : String(val), ok = evalAns(q, v);
  const k = tkey(q.area, q.tema), st = me.stats[k] = me.stats[k] || { c: 0, t: 0 }; st.t++; if (ok) st.c++; persist();
  bt.sending = true;
  try { await Store.dPatch('battles', b.id, { ['resp.q' + b.i + '.' + mem.k]: { ok, v } }); } catch (e) { console.error(e); toast('No se pudo enviar tu respuesta.'); }
  bt.sending = false;
}
const hpBar = (t, label, hit) => { const pct = Math.round(t.hp / BT_HP * 100); return `<div class="${hit ? 'hit' : ''}"><b>${esc(label)}</b> <span class="mute">${esc(t.nombre)}</span><div class="hpbar ${pct <= 30 ? 'low' : ''}"><i style="width:${pct}%"></i></div><div class="mute" style="font-weight:800">❤️ ${t.hp} / ${BT_HP}</div></div>`; };
function renderBattle() {
  const bt = S.battle, b = bt.data;
  if (!b) { toast('La batalla se canceló.'); btBack(); return; }
  const me = S.me, side = btSide(b), a = areaById(b.area);
  if (!side) { btStop(); closeModal(); return; }
  const foe = side === 'A' ? 'B' : 'A', mine = b[side], rival = b[foe];
  const head = mhead('⚔️', 'Batalla · ' + a.nombre);
  if (b.estado === 'esperando') {
    const host = b.host === me.id;
    openModal(`${head}<div class="mbody"><div class="big">⏳</div><h2 style="text-align:center;font-size:26px">Esperando a un equipo rival…</h2>
      <div class="say" style="text-align:center">Código de la batalla: <b style="font-size:26px;letter-spacing:3px">${esc(b.id)}</b><br><span class="mute">Pásalo al líder de otro equipo, o espera a que te encuentren en «Buscar rival».</span></div>
      <div class="list">${mine.miembros.map(m => `<div class="rk" style="grid-template-columns:1fr"><span>${esc(m.n)}</span></div>`).join('')}</div>
      ${host ? '<button class="btn coral" data-m="btCancel">Cancelar batalla</button>' : '<div class="mute">El líder puede cancelar la batalla.</div>'}</div>`, { color: '#ffd6d6' });
    return;
  }
  if (b.estado === 'listo') {
    openModal(`${head}<div class="mbody"><div class="vs"><div class="say" style="text-align:center"><b>${esc(b.A.nombre)}</b><br>${b.A.miembros.length} integrantes</div><div class="big">⚔️</div><div class="say" style="text-align:center"><b>${esc(b.B.nombre)}</b><br>${b.B.miembros.length} integrantes</div></div>
      <h2 style="text-align:center;font-size:26px">¡Prepárense! La batalla empieza en unos segundos…</h2></div>`, { color: '#ffd6d6' });
    return;
  }
  const prev = bt.lastHp, hitMine = prev && mine.hp < prev[side], hitFoe = prev && rival.hp < prev[foe];
  bt.lastHp = { A: b.A.hp, B: b.B.hp }; if (hitMine || hitFoe) beep(!hitMine);
  if (b.estado === 'jugando') {
    const mem = btMe(b, side), q = b.pregs[b.i], resp = (b.resp && b.resp['q' + b.i]) || {}, mineA = mem ? resp[mem.k] : null;
    const myDone = mine.miembros.map(m => `<span class="tag" style="font-size:13px">${resp[m.k] ? '✅' : '⏳'} ${esc(m.n.split(' ')[0])}</span>`).join('');
    const foeDone = rival.miembros.filter(m => resp[m.k]).length;
    const pr = b.i > 0 && b.rondas && b.rondas['q' + (b.i - 1)];
    const banner = pr ? `<div class="say" style="text-align:center;font-weight:800">Ronda ${b.i}: tu equipo hizo <span style="color:var(--ok)">−${side === 'A' ? pr.b : pr.a}</span> de daño · el rival hizo <span style="color:var(--bad)">−${side === 'A' ? pr.a : pr.b}</span></div>` : '';
    let body = '';
    if (q.tipo === 'mcq') body = `<div class="opts">${q.opciones.map((o, idx) => `<button class="opt ${mineA ? (idx === q.correcta ? 'ok' : (mineA.v === idx ? 'bad' : '')) : ''}" data-m="btAns" data-v="${idx}" ${mineA ? 'disabled' : ''}>${esc(o)}</button>`).join('')}</div>`;
    else if (q.tipo === 'vf') body = `<div class="opts">${[['true', '✔ Verdadero'], ['false', '✘ Falso']].map(([v, t]) => `<button class="opt ${mineA ? (((v === 'true') === q.correcta) ? 'ok' : ((mineA.v === (v === 'true')) ? 'bad' : '')) : ''}" data-m="btAns" data-v="${v}" ${mineA ? 'disabled' : ''}>${t}</button>`).join('')}</div>`;
    else if (!mineA) body = `<div class="row"><input id="btNum" inputmode="decimal" autocomplete="off" placeholder="Escribe tu respuesta"><button class="btn" data-m="btNumOk" style="flex:0 0 auto">Responder</button></div>`;
    else body = `<div class="say">Tu respuesta: <b>${esc(String(mineA.v))}</b></div>`;
    const after = mineA ? `<div class="fb ${mineA.ok ? 'ok' : 'bad'}"><h3>${mineA.ok ? '¡Golpe certero! 💥' : 'Fallaste'}</h3>${mineA.ok ? '' : `<div>La respuesta correcta es <b>${esc(correctText(q))}</b>.</div>`}<div style="margin-top:6px">${esc(q.explicacion)}</div></div><div class="mute" style="font-weight:800">Esperando al resto de los equipos…</div>` : '';
    openModal(`${head}<div class="mbody">
      <div class="vs">${hpBar(mine, 'Tu equipo', hitMine)}<div class="big" style="font-size:30px">⚔️</div>${hpBar(rival, 'Rival', hitFoe)}</div>
      <div class="qhead"><span class="mute">Pregunta ${b.i + 1} de ${b.pregs.length}</span><b>⏱️ <span id="btTmr">${Math.max(0, BT_SECS - Math.floor((Date.now() - b.t0) / 1000))}</span> s</b></div>
      ${banner}<div class="enun">${esc(q.enunciado)}</div>${body}${after}
      <div><span class="mute">Tu equipo:</span> ${myDone} <span class="mute">· Rival: ${foeDone} de ${rival.miembros.length} respondieron</span></div>
      <button class="btn sm alt" id="btSkip" data-m="btNext" hidden>El rival se demora: avanzar</button></div>`, { color: '#ffd6d6' });
    if (!mineA && q.tipo === 'num') { const inp = $('#btNum'); if (inp) inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); btAnswer(inp.value); } }); }
    return;
  }
  const win = b.ganador === side, tie = b.ganador === 'E';
  if (!bt.reward) bt.reward = btReward(b);
  const rw = bt.reward, per = mine.miembros.map(m => { let c = 0; for (let j = 0; j < b.pregs.length; j++) { const r = b.resp && b.resp['q' + j] && b.resp['q' + j][m.k]; if (r && r.ok) c++; } return { m, c }; });
  openModal(`${head}<div class="mbody"><div class="big">${win ? '🏆' : tie ? '🤝' : '💪'}</div><h2 style="text-align:center;font-size:28px">${win ? '¡Ganó tu equipo!' : tie ? '¡Empate!' : 'Esta vez ganó el rival'}</h2>
    <div class="vs">${hpBar(mine, 'Tu equipo', false)}<div class="big" style="font-size:30px">⚔️</div>${hpBar(rival, 'Rival', false)}</div>
    <div class="kpis">${rw ? `<div class="kpi"><b>+${rw.xp}</b>XP para ti</div><div class="kpi"><b>+${rw.coins}</b>🪙</div><div class="kpi"><b>+${rw.rg} ${RES[b.area][0]}</b>${RES[b.area][1]}</div><div class="kpi"><b>+${rw.fich}</b>💬 fichas</div>` : '<div class="kpi"><b>✔</b>recompensa recibida</div>'}</div>
    <div class="list">${per.map(x => `<div class="rk" style="grid-template-columns:1fr auto"><span>${esc(x.m.n)}</span><span>${x.c} de ${b.pregs.length} aciertos</span></div>`).join('')}</div>
    <div class="say">${win ? 'Las victorias cuentan en tu perfil: ¡sigan practicando para la próxima batalla!' : 'Repasen los temas y pidan la revancha. ¡Cada batalla enseña algo!'}</div>
    <button class="btn mint" data-m="btBack">Volver al equipo</button></div>`, { color: '#ffd6d6' });
}
function btReward(b) {
  const me = S.me, side = btSide(b); if (!side || me.battleDone === b.id) return null;
  const mm = btMe(b, side), win = b.ganador === side, tie = b.ganador === 'E'; let corr = 0;
  for (let j = 0; j < b.pregs.length; j++) { const r = b.resp && b.resp['q' + j] && b.resp['q' + j][mm.k]; if (r && r.ok) corr++; }
  const xp = (win ? 40 : tie ? 25 : 15) + 3 * corr, coins = win ? 15 : tie ? 8 : 5, rg = Math.floor(corr / 2) + (win ? 3 : 0), fich = win ? 6 : 2;
  me.xp += xp; me.coins += coins; me.res[b.area] = (me.res[b.area] || 0) + rg; if (win) me.bw = (me.bw || 0) + 1; me.battleDone = b.id;
  giveFichas(fich); persist(true); updateHUD();
  return { xp, coins, rg, fich };
}
async function tBatallasInfo(box) {
  let list = []; try { list = await Store.dAll('battles'); } catch (e) { return; }
  const fin = list.filter(b => b.estado === 'fin').length, act = list.filter(b => b.estado === 'jugando').length, esp = list.filter(b => b.estado === 'esperando' || b.estado === 'listo').length;
  box.insertAdjacentHTML('beforeend', `<div class="panel" style="padding:14px;display:grid;gap:8px;margin-top:14px"><h3 style="font-size:20px">Batallas entre equipos</h3><p class="mute" style="margin:0">${act} en juego · ${esp} esperando rival · ${fin} terminadas.</p><div><button class="btn sm coral" data-m="btClean">Borrar batallas terminadas y antiguas</button></div></div>`);
}

/* =====================================================================
   INICIO
   ===================================================================== */
(async function init() {
  resize(); buildWorld(); buildPlazaProps(); buildCityScene(); applyWorld(1); tick();
  $('#colegioName').textContent = CONFIG.colegio;
  await Store.init();
  try { const c = await Store.loadContent(); S.retos = c.retos; S.lecciones = c.lecciones; S.config = c.config; S.juegos = c.juegos; }
  catch (e) { console.warn(e); S.retos = SEED.slice(); toast('Sin conexión con la base de datos: se muestran retos de ejemplo.'); }
})();
</script>
