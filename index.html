<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MundoSaber · IE 0148 Maestro Víctor Raúl Haya de la Torre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b2440; --sun:#ffc233; --coral:#ff6b57; --mint:#2fbf9b; --sky:#9fd8ff; --paper:#ffffff; --soft:#eef4ff; --mute:#5b6686;
  --ok:#22a06b; --bad:#e5484d;
  --display:'Lilita One','Trebuchet MS','Arial Rounded MT Bold',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);font-family:var(--body);color:var(--ink)}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
[hidden]{display:none!important}
button{font-family:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:.3px}

/* ---------- piezas base ---------- */
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink)}
.btn{background:var(--sun);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:10px 18px;font-weight:800;font-size:16px;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,.chip:focus-visible,.opt:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.btn.alt{background:#fff}
.btn.mint{background:var(--mint);color:#fff}
.btn.coral{background:var(--coral);color:#fff}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:11px;box-shadow:0 3px 0 var(--ink)}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:6px 12px;font-weight:800;font-size:14px}
.chip.on{background:var(--ink);color:#fff}
label{font-weight:800;font-size:14px;display:block;margin:0 0 4px}
input,select,textarea{width:100%;font:inherit;font-weight:700;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:12px;padding:9px 12px}
textarea{resize:vertical;min-height:70px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.mute{color:var(--mute);font-size:14px;font-weight:700}
.bar{height:14px;border:2.5px solid var(--ink);border-radius:9px;background:#fff;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c,var(--mint));transition:width .5s}

/* ---------- acceso ---------- */
#screen-login{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:14px;overflow:auto}
.logo{font-family:var(--display);font-size:clamp(46px,9vw,88px);line-height:.95;color:#fff;text-align:center;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
.logo small{display:block;font-size:.3em;-webkit-text-stroke:2px var(--ink);text-shadow:0 3px 0 var(--ink);margin-top:10px;color:var(--sun)}
#loginCard{width:min(440px,100%);padding:20px;display:grid;gap:12px}
#loginCard .priv{font-size:12.5px;color:var(--mute);font-weight:700;text-align:center}
.linkbtn{background:none;border:none;color:#fff;font-weight:800;text-decoration:underline;text-shadow:0 2px 0 var(--ink);font-size:15px}

/* ---------- creador de avatar ---------- */
#screen-creator{position:fixed;z-index:5;left:0;top:0;bottom:0;width:min(400px,100%);padding:14px;display:flex;pointer-events:none}
#creatorPanel{pointer-events:auto;width:100%;padding:16px;overflow:auto;display:flex;flex-direction:column;gap:12px;align-self:stretch}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);padding:0}
.sw button.on{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--coral)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.item{border:3px solid var(--ink);border-radius:14px;padding:8px;text-align:center;background:var(--soft);font-weight:800;font-size:13px;display:grid;gap:4px;justify-items:center}
.item.on{background:var(--sun)}
.item .em{font-size:26px;line-height:1}
@media (max-width:760px){
  #screen-creator{top:auto;height:54vh;padding:8px}
}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:4}
#hud>*{pointer-events:auto}
#hudMe{position:absolute;left:12px;top:12px;padding:8px 12px 8px 8px;display:flex;gap:10px;align-items:center;max-width:min(300px,62vw)}
.face{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);flex:none;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:#fff;text-shadow:0 2px 0 var(--ink)}
#hudMe b{display:block;font-size:14px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hudMe .lv{font-size:12px;font-weight:800;color:var(--mute);margin-bottom:3px}
#hudMe .bar{height:10px;width:130px;max-width:100%}
#hudTools{position:absolute;right:12px;top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:56vw}
#coins{background:var(--sun);border:3px solid var(--ink);border-radius:12px;padding:5px 11px;font-weight:800;box-shadow:0 3px 0 var(--ink)}
#hudWorld{position:absolute;left:12px;top:80px;background:#fff;box-shadow:0 3px 0 var(--ink);max-width:70vw}
#btnTalk{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);font-size:18px;padding:13px 22px;max-width:92vw}
#hint{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);color:#fff;font-weight:800;text-shadow:0 2px 0 var(--ink),0 0 6px var(--ink);text-align:center;font-size:14px;pointer-events:none;width:90vw}
#joy{position:absolute;left:22px;bottom:22px;width:132px;height:132px;border-radius:50%;background:rgba(27,36,64,.22);border:3px solid rgba(27,36,64,.6);touch-action:none;display:none}
#joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#fff;border:3px solid var(--ink)}
@media (pointer:coarse){#joy{display:block}#hint{display:none}}
#toast{position:fixed;left:50%;top:76px;transform:translate(-50%,-20px);z-index:30;background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-weight:800;opacity:0;transition:.25s;pointer-events:none;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- ventanas ---------- */
#modal{position:fixed;inset:0;z-index:20;background:rgba(18,26,48,.55);display:flex;align-items:center;justify-content:center;padding:12px}
#modalCard{width:min(720px,100%);max-height:92vh;overflow:auto;padding:0;position:relative}
#modalCard.wide{width:min(1040px,100%)}
.mhead{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--c,var(--sun));border-bottom:3px solid var(--ink);border-radius:14px 14px 0 0;position:sticky;top:0;z-index:2}
.mhead h2{font-size:26px;flex:1;color:var(--ink)}
.mhead .em{font-size:32px}
.mbody{padding:16px 18px 20px;display:grid;gap:14px}
.say{background:var(--soft);border:3px solid var(--ink);border-radius:16px;padding:12px 14px;font-weight:700;position:relative}
.tema{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;border:3px solid var(--ink);border-radius:16px;padding:12px 14px;background:#fff}
.tema h3{font-size:20px}
.tema .bar{grid-column:1/-1}
.stars{letter-spacing:2px;font-size:18px}
.qhead{display:flex;align-items:center;gap:10px;justify-content:space-between}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--ink);background:#fff}
.dots i.ok{background:var(--ok)}.dots i.bad{background:var(--bad)}.dots i.cur{background:var(--sun)}
.enun{font-size:21px;font-weight:800;line-height:1.3}
.opts{display:grid;gap:10px}
.opt{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:12px 14px;text-align:left;font-weight:800;font-size:17px;box-shadow:0 3px 0 var(--ink)}
.opt:active{transform:translateY(2px)}
.opt.ok{background:#c9f2df;border-color:var(--ok)}
.opt.bad{background:#ffd6d6;border-color:var(--bad)}
.opt[disabled]{pointer-events:none}
.fb{border:3px solid var(--ink);border-radius:16px;padding:12px 14px;font-weight:700}
.fb.ok{background:#e3f8ee}.fb.bad{background:#ffe9e9}
.fb h3{font-size:22px;margin-bottom:4px}
.big{font-size:56px;text-align:center;line-height:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpi{border:3px solid var(--ink);border-radius:14px;padding:10px;text-align:center;background:var(--soft)}
.kpi b{display:block;font-family:var(--display);font-weight:400;font-size:28px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.pod{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end}
.pod>div{border:3px solid var(--ink);border-radius:16px;text-align:center;padding:10px 6px;background:var(--soft)}
.pod .p1{background:var(--sun);padding-bottom:26px}
.pod .p2{background:#dfe6f5;padding-bottom:14px}
.pod .p3{background:#f3d3b5}
.pod .m{font-size:34px}
.pod b{display:block;font-size:14px;line-height:1.15;word-break:break-word}
.rk{display:grid;grid-template-columns:34px 30px 1fr auto;gap:10px;align-items:center;border:3px solid var(--ink);border-radius:13px;padding:7px 10px;background:#fff;font-weight:800;font-size:14px}
.rk.me{background:#fff3c4}
.rk .face{width:30px;height:30px;font-size:13px}
.list{display:grid;gap:8px}
table{width:100%;border-collapse:collapse;font-size:14px;font-weight:700}
th,td{border-bottom:2px solid #d8def0;padding:7px 8px;text-align:left}
th{background:var(--soft);position:sticky;top:0}
.tbl{overflow:auto;max-height:46vh;border:3px solid var(--ink);border-radius:12px}
.rcard{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:3px solid var(--ink);border-radius:14px;padding:10px 12px;background:#fff}
.rcard p{margin:0;font-weight:800}
.tag{display:inline-block;font-size:12px;font-weight:800;border:2px solid var(--ink);border-radius:8px;padding:1px 7px;margin:4px 4px 0 0;background:var(--soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}.enun{font-size:19px}}

/* ---------- Mi ciudad ---------- */
#screen-city{position:fixed;inset:0;z-index:5;pointer-events:none}
#screen-city>*{pointer-events:auto}
#cityTop{position:absolute;left:12px;top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 110px)}
#cityZoom{position:absolute;right:12px;top:12px;display:flex;gap:8px}
#cityPanel{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:min(1000px,calc(100% - 16px));max-height:40vh;overflow:auto;padding:10px 12px;display:grid;gap:8px}
.rchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.rchip{flex:none;background:var(--soft);border:2.5px solid var(--ink);border-radius:10px;padding:2px 8px;font-weight:800;font-size:13px}
.citems{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px}
.citem{flex:none;width:122px;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:8px 6px;display:grid;gap:2px;justify-items:center;text-align:center;box-shadow:0 3px 0 var(--ink);color:var(--ink);font-weight:800;font-size:13px}
.citem .em{font-size:28px;line-height:1}
.citem .cost{background:var(--sun);border:2px solid var(--ink);border-radius:8px;padding:0 7px;font-size:13px}
.citem small{color:var(--mute);font-size:11px;line-height:1.1}
.cbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.opt.sel{background:var(--sun)}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{min-height:78px;border:3px solid var(--ink);border-radius:12px;background:var(--soft);font-weight:800;font-size:13px;padding:6px;display:grid;place-items:center;text-align:center;box-shadow:0 3px 0 var(--ink);color:var(--ink);line-height:1.2}
.mc.open{background:#fff}.mc.ok{background:#c9f2df}
@media (max-width:560px){.mgrid{grid-template-columns:repeat(3,1fr)}}
/* ---------- chat en vivo ---------- */
#chatDock{position:fixed;left:12px;bottom:12px;z-index:6;width:min(350px,calc(100vw - 24px));display:flex;flex-direction:column;max-height:min(52vh,420px);padding:0}
#chatDock[hidden]{display:none}
.chat-head{display:flex;gap:6px;align-items:center;padding:8px;border-bottom:3px solid var(--ink);background:var(--soft);border-radius:14px 14px 0 0}
#chatTabs{display:flex;gap:4px;flex-wrap:wrap;flex:1}
#chatTabs .chip{padding:3px 8px;font-size:12px}
#chatList{flex:1;overflow:auto;padding:8px;display:grid;gap:6px;min-height:120px;align-content:start}
.cm{display:grid;grid-template-columns:30px 1fr;gap:8px;font-size:14px;font-weight:700;line-height:1.25;word-break:break-word}
.cm .face{width:28px;height:28px;font-size:12px}
.cm small{color:var(--mute);font-weight:700}
.cm.me{background:#fff3c4;border-radius:10px;padding:2px 4px}
.cm button{background:none;border:none;padding:0 4px;font-size:13px;opacity:.6;color:var(--ink)}
#chatForm{display:flex;gap:6px;padding:8px;border-top:3px solid var(--ink)}
#chatForm input{padding:7px 10px}
#chatBadge{font-weight:800}
@media (pointer:coarse){#chatDock{bottom:0;left:0;right:0;width:100%;max-height:46vh;border-radius:14px 14px 0 0}}
.hpbar{height:18px;border:3px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden}
.hpbar>i{display:block;height:100%;background:var(--ok);transition:width .7s}
.hpbar.low>i{background:var(--bad)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.hit{animation:shake .45s}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="world"></canvas>

<!-- Acceso / registro -->
<section id="screen-login">
  <div class="logo">MundoSaber<small id="colegioName">Aprende explorando</small></div>
  <form id="loginCard" class="panel" autocomplete="off">
    <div><label for="inApe">Apellidos</label><input id="inApe" required maxlength="60" placeholder="Ej. Quispe Ramos"></div>
    <div><label for="inNom">Nombres</label><input id="inNom" required maxlength="60" placeholder="Ej. Ana Lucía"></div>
    <div class="row">
      <div><label for="inGrado">Grado</label>
        <select id="inGrado"><option value="1">1° de secundaria</option><option value="2">2° de secundaria</option><option value="3">3° de secundaria</option><option value="4">4° de secundaria</option><option value="5">5° de secundaria</option></select></div>
      <div><label for="inSec">Sección</label>
        <select id="inSec"><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option></select></div>
    </div>
    <button class="btn" type="submit" id="btnEnter">Entrar al mundo</button>
    <div class="priv">Se guardan solo tu nombre, grado, sección y tu progreso en el juego.</div>
  </form>
  <button class="linkbtn" id="btnDocente" type="button">Soy docente</button>
</section>

<!-- Creador de avatar -->
<section id="screen-creator" hidden><div id="creatorPanel" class="panel"></div></section>

<!-- HUD -->
<section id="hud" hidden>
  <div id="hudMe" class="panel">
    <div class="face" id="hudFace">A</div>
    <div style="min-width:0"><b id="hudName"></b><div class="lv" id="hudLv"></div><div class="bar"><i id="hudXp" style="width:0"></i></div></div>
  </div>
  <div id="hudTools">
    <div id="coins">🪙 <span id="hudCoins">0</span></div>
    <button class="btn sm" data-act="perfil">Mi progreso</button>
    <button class="btn sm" data-act="ranking">Ranking</button>
    <button class="btn sm" data-act="mundos">Mundos</button>
    <button class="btn sm" data-act="equipo">Equipo</button>
    <button class="btn sm mint" data-act="chat" id="btnChat" hidden>Chat<span id="chatBadge"></span></button>
    <button class="btn sm mint" data-act="ciudad">Mi ciudad</button>
    <button class="btn sm coral" data-act="plaza" id="btnPlaza" hidden>Volver a la plaza</button>
    <button class="btn sm alt" data-act="avatar">Avatar</button>
    <button class="btn sm alt" data-act="salir">Salir</button>
  </div>
  <div id="hudWorld" class="chip" hidden></div>
  <div id="hint">Muévete con W A S D o las flechas · arrastra para girar la cámara · E para hablar</div>
  <button id="btnTalk" class="btn mint" hidden></button>
  <div id="joy"><i id="joyKnob"></i></div>
</section>

<!-- Mi ciudad -->
<section id="screen-city" hidden>
  <div id="cityTop"><button class="btn sm" data-k="back">← Volver al mundo</button><div class="chip" id="cityTitle">Mi ciudad</div></div>
  <div id="cityZoom"><button class="btn sm alt" data-k="zin" aria-label="Acercar">＋</button><button class="btn sm alt" data-k="zout" aria-label="Alejar">−</button></div>
  <div id="cityPanel" class="panel"></div>
</section>

<!-- Chat en vivo -->
<section id="chatDock" class="panel" hidden aria-label="Chat">
  <div class="chat-head"><div id="chatTabs"></div><span id="chatFichas" class="mute" style="font-size:12px;font-weight:800"></span><button type="button" class="btn sm" data-ck="fich" id="chatFichBtn">Fichas</button><button type="button" class="btn sm alt" data-ck="min" aria-label="Cerrar el chat">✕</button></div>
  <div id="chatList" aria-live="polite"></div>
  <div id="chatQuick" style="display:flex;gap:4px;flex-wrap:wrap;padding:6px 8px;border-top:2px solid #d8def0"></div>
  <form id="chatForm" autocomplete="off"><input id="chatIn" maxlength="120" placeholder="Escribe un mensaje (máx. 120 letras)" aria-label="Mensaje"><button class="btn sm" type="submit">Enviar</button></form>
</section>

<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" hidden><div id="modalCard" class="panel" role="dialog" aria-modal="true"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =====================================================================
   MUNDOSABER · juego educativo 3D por áreas curriculares
   ---------------------------------------------------------------------
   CONFIGURACIÓN RÁPIDA
   · colegio        → nombre que aparece en la portada.
   · claveDocente   → clave para entrar al panel docente (cámbiala).
   · firebase       → null = el avance se guarda solo en este equipo.
                      Pega aquí tu configuración de Firebase (Firestore)
                      para tener ranking y panel docente de todo el colegio.
   ===================================================================== */
const CONFIG = {
  colegio: 'Institución Educativa 0148 Maestro Víctor Raúl Haya de la Torre',
  claveDocente: 'docente2026',
  firebase: null
  /* Ejemplo:
  firebase: { apiKey:'...', authDomain:'...', projectId:'...', storageBucket:'...', messagingSenderId:'...', appId:'...' }
  */
};

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim().replace(/\s+/g, ' ');
const uid = () => 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const titleCase = s => s.trim().replace(/\s+/g, ' ').toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());

/* ---------- áreas curriculares ---------- */
const AREAS = [
  { id:'mat',  nombre:'Matemática',               lugar:'Laboratorio',        emoji:'📐', color:'#3b82f6' },
  { id:'com',  nombre:'Comunicación',             lugar:'Biblioteca',         emoji:'📚', color:'#ef4444' },
  { id:'ing',  nombre:'Inglés',                   lugar:'Puerto',             emoji:'🌎', color:'#14b8a6' },
  { id:'art',  nombre:'Arte y Cultura',           lugar:'Taller de Arte',     emoji:'🎨', color:'#ec4899' },
  { id:'dpcc', nombre:'DPCC',                     lugar:'Plaza Cívica',       emoji:'🤝', color:'#f59e0b' },
  { id:'soc',  nombre:'Ciencias Sociales',        lugar:'Museo',              emoji:'🏛️', color:'#8b5cf6' },

/* ---------- almacenamiento (local o Firebase) ---------- */
const loadScript = src => new Promise((ok, err) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => err(new Error('No cargó ' + src)); document.head.appendChild(s); });
const Store = {
  mode: 'local', db: null, rtdb: null, _rk: {}, _allc: null,
  async init() {
    if (!CONFIG.firebase) return;
    try {
      await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
      firebase.initializeApp(CONFIG.firebase);
      this.db = firebase.firestore();
      this.mode = 'online';
      if (CONFIG.firebase.databaseURL) { try { await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js'); this.rtdb = firebase.database(); } catch (e2) { console.warn('Realtime Database no disponible.', e2); } }
    } catch (e) { console.warn('Firebase no disponible; se usa el modo local.', e); }
  },
  _get(k, def) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? def; } catch (e) { return def; } },
  _set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { console.warn(e); } },

  /* ---------- contenido (retos, lecciones, juegos, configuración) ----------
     En línea se guarda en pocos documentos (config/main y contenido/*) y se
     descarga solo si el docente lo cambió: así cada ingreso cuesta 1 lectura. */
  async loadContent() {
    if (this.mode !== 'online') return { retos: await this.getRetos(), lecciones: await this.getLecciones(), juegos: await this.getJuegos(), config: await this.getConfig() };
    const ref = this.db.collection('config').doc('main');
    const snap = await ref.get(); let cfg = snap.exists ? snap.data() : {};
    if (!cfg.seedv || cfg.seedv < SEED_VERSION) cfg = await this._seedOnline(cfg);
    const ver = cfg.ver || {}, cache = this._get('ms_cache', {}), cv = cache.v || {};
    if (cache.retos && cv.retos === ver.retos && cv.lecciones === ver.lecciones && cv.juegos === ver.juegos)
      return { retos: cache.retos, lecciones: cache.lecciones, juegos: cache.juegos, config: this._cfgOf(cfg) };
    const all = await this.db.collection('contenido').get();
    let retos = [], lecciones = [], juegos = [];
    all.forEach(d => { const items = d.data().items || []; if (d.id.startsWith('retos_')) retos = retos.concat(items); else if (d.id === 'lecciones') lecciones = items; else if (d.id === 'juegos') juegos = items; });
    this._set('ms_cache', { v: { retos: ver.retos, lecciones: ver.lecciones, juegos: ver.juegos }, retos, lecciones, juegos });
    return { retos, lecciones, juegos, config: this._cfgOf(cfg) };
  },
  _cfgOf(c) { return { bimestreActual: c.bimestreActual || 1, abrirTodos: !!c.abrirTodos, chat: Object.assign({ seccion: true, grado: true, colegio: false, presencia: true }, c.chat || {}) }; },
  async _seedOnline(cfg) {
    const col = this.db.collection('contenido'), existing = {};
    if (cfg.seedv) { const all = await col.get(); all.forEach(d => { existing[d.id] = d.data().items || []; }); }
    const byArea = {}; AREAS.forEach(a => { byArea[a.id] = []; }); SEED.forEach(r => { if (byArea[r.area]) byArea[r.area].push(r); });
    const ops = [];
    AREAS.forEach(a => {
      const have = existing['retos_' + a.id] || [], ids = new Set(have.map(r => r.id)), add = byArea[a.id].filter(r => !ids.has(r.id));
      if (add.length || !cfg.seedv) ops.push(col.doc('retos_' + a.id).set({ items: have.concat(add) }));
    });
    if (!existing.lecciones) ops.push(col.doc('lecciones').set({ items: LESS_SEED }));
    if (!existing.juegos) ops.push(col.doc('juegos').set({ items: JUEGOS_SEED }));
    await Promise.all(ops);
    const v = cfg.ver || {}, out = Object.assign({}, cfg, { seedv: SEED_VERSION, ver: { retos: (v.retos || 0) + 1, lecciones: (v.lecciones || 0) + 1, juegos: (v.juegos || 0) + 1 } });
    await this.db.collection('config').doc('main').set(out, { merge: true });
    return out;
  },
  async _mut(docId, fn) {
    const ref = this.db.collection('contenido').doc(docId);
    await this.db.runTransaction(async tx => { const s = await tx.get(ref); const items = s.exists ? (s.data().items || []) : []; tx.set(ref, { items: fn(items) }); });
  },
  _bump(kind) { return this.db.collection('config').doc('main').update({ ['ver.' + kind]: firebase.firestore.FieldValue.increment(1) }); },

  async getRetos() {
    if (this.mode === 'online') return (await this.loadContent()).retos;
    let list = this._get('ms_retos', null);
    if (!list) list = SEED.slice();
    else if (this._get('ms_seedv', 0) < SEED_VERSION) {
      const have = new Set(list.map(r => r.id)); SEED.forEach(r => { if (!have.has(r.id)) list.push(r); });
      list.forEach(r => { if (!r.bimestre) { const s = SEED.find(x => x.id === r.id); r.bimestre = s ? s.bimestre : 1; } });
    }
    this._set('ms_retos', list); this._set('ms_seedv', SEED_VERSION);
    return list;
  },
  async saveReto(r, oldArea) {
    if (this.mode === 'online') {
      if (oldArea && oldArea !== r.area) await this._mut('retos_' + oldArea, it => it.filter(x => x.id !== r.id));
      await this._mut('retos_' + r.area, it => { const i = it.findIndex(x => x.id === r.id); if (i >= 0) it[i] = r; else it.push(r); return it; });
      return this._bump('retos');
    }
    const list = this._get('ms_retos', []); const i = list.findIndex(x => x.id === r.id);
    if (i >= 0) list[i] = r; else list.push(r); this._set('ms_retos', list);
  },
  async deleteReto(id, area) {
    if (this.mode === 'online') { await this._mut('retos_' + area, it => it.filter(x => x.id !== id)); return this._bump('retos'); }
    this._set('ms_retos', this._get('ms_retos', []).filter(x => x.id !== id));
  },
  async replaceRetos(list) {
    if (this.mode === 'online') {
      const byArea = {}; list.forEach(r => { (byArea[r.area] = byArea[r.area] || []).push(r); });
      for (const area of Object.keys(byArea)) await this._mut('retos_' + area, it => { const ids = new Set(byArea[area].map(r => r.id)); return it.filter(x => !ids.has(x.id)).concat(byArea[area]); });
      return this._bump('retos');
    }
    this._set('ms_retos', list);
  },
  async getLecciones() {
    if (this.mode === 'online') return (await this.loadContent()).lecciones;
    let list = this._get('ms_lecciones', null);
    if (!list) { list = LESS_SEED.slice(); this._set('ms_lecciones', list); }
    return list;
  },
  async saveLeccion(l) {
    if (this.mode === 'online') { await this._mut('lecciones', it => { const i = it.findIndex(x => x.id === l.id); if (i >= 0) it[i] = l; else it.push(l); return it; }); return this._bump('lecciones'); }
    const list = this._get('ms_lecciones', []); const i = list.findIndex(x => x.id === l.id);
    if (i >= 0) list[i] = l; else list.push(l); this._set('ms_lecciones', list);
  },
  async deleteLeccion(id) {
    if (this.mode === 'online') { await this._mut('lecciones', it => it.filter(x => x.id !== id)); return this._bump('lecciones'); }
    this._set('ms_lecciones', this._get('ms_lecciones', []).filter(x => x.id !== id));
  },
  async getJuegos() {
    if (this.mode === 'online') return (await this.loadContent()).juegos;
    let list = this._get('ms_juegos', null); if (!list) { list = JUEGOS_SEED.slice(); this._set('ms_juegos', list); } return list;
  },
  async saveJuego(j) {
    if (this.mode === 'online') { await this._mut('juegos', it => { const i = it.findIndex(x => x.id === j.id); if (i >= 0) it[i] = j; else it.push(j); return it; }); return this._bump('juegos'); }
    const list = this._get('ms_juegos', []); const i = list.findIndex(x => x.id === j.id);
    if (i >= 0) list[i] = j; else list.push(j); this._set('ms_juegos', list);
  },
  async deleteJuego(id) {
    if (this.mode === 'online') { await this._mut('juegos', it => it.filter(x => x.id !== id)); return this._bump('juegos'); }
    this._set('ms_juegos', this._get('ms_juegos', []).filter(x => x.id !== id));
  },
  async getConfig() {
    const def = { bimestreActual: 1, abrirTodos: false };
    if (this.mode === 'online') return (await this.loadContent()).config;
    const cfg = Object.assign(def, this._get('ms_config', {})); cfg.chat = Object.assign({ seccion: true, grado: true, colegio: false, presencia: true }, cfg.chat || {}); return cfg;
  },
  async saveConfig(c) {
    if (this.mode === 'online') return this.db.collection('config').doc('main').set({ bimestreActual: c.bimestreActual, abrirTodos: !!c.abrirTodos, chat: c.chat || {} }, { merge: true });
    this._set('ms_config', c);
  },

  /* ---------- estudiantes ---------- */
  async getStudent(id) {
    if (this.mode === 'online') { const d = await this.db.collection('students').doc(id).get(); return d.exists ? d.data() : null; }
    return this._get('ms_students', {})[id] || null;
  },
  async saveStudent(s) {
    s.updated = Date.now();
    if (this.mode === 'online') return this.db.collection('students').doc(s.id).set(s);
    const all = this._get('ms_students', {}); all[s.id] = s; this._set('ms_students', all);
  },
  async allStudents() {
    if (this.mode === 'online') {
      if (this._allc && Date.now() - this._allc.t < 120000) return this._allc.list;
      const snap = await this.db.collection('students').get(); const list = snap.docs.map(d => d.data());
      this._allc = { t: Date.now(), list }; return list;
    }
    return Object.values(this._get('ms_students', {}));
  },
  async topStudents(scope, me) {
    if (this.mode !== 'online') return this.allStudents();
    const key = scope + '|' + me.grado + '|' + me.seccion, hit = this._rk[key];
    if (hit && Date.now() - hit.t < 180000) return hit.list;
    let q = this.db.collection('students');
    if (scope === 'seccion') q = q.where('grado', '==', me.grado).where('seccion', '==', me.seccion);
    else if (scope === 'grado') q = q.where('grado', '==', me.grado);
    let list;
    try { const snap = await q.orderBy('xp', 'desc').limit(20).get(); list = snap.docs.map(d => d.data()); }
    catch (e) {
      console.warn('Falta un índice de Firestore para el ranking; se usa una lectura más amplia.', e);
      const snap = await q.limit(200).get(); list = snap.docs.map(d => d.data()).sort((a, b) => b.xp - a.xp).slice(0, 20);
    }
    this._rk[key] = { t: Date.now(), list }; return list;
  }
};

const joyEl = $('#joy'), joyKnob = $('#joyKnob');
function moveJoy(e) {
  const r = joyEl.getBoundingClientRect(); const max = r.width / 2 - 14;
  let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const len = Math.hypot(dx, dy); if (len > max) { dx *= max / len; dy *= max / len; }
  joyKnob.style.transform = `translate(${dx}px,${dy}px)`; joy.x = dx / max; joy.y = -dy / max;
}
function endJoy() { joy.active = false; joy.x = joy.y = 0; joyKnob.style.transform = 'translate(0,0)'; }
joyEl.addEventListener('pointerdown', e => { joy.active = true; try { joyEl.setPointerCapture(e.pointerId); } catch (x) {} moveJoy(e); });

function movePlayer(dt) {
  let ix = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0) + joy.x;
  let iy = (keys['w'] || keys['arrowup'] ? 1 : 0) - (keys['s'] || keys['arrowdown'] ? 1 : 0) + joy.y;
  const len = Math.hypot(ix, iy);
  if (len > 1) { ix /= len; iy /= len; }
  const moving = len > 0.08, u = player.userData;
  if (moving) {
    const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw), rx = Math.cos(camYaw), rz = -Math.sin(camYaw);
    const mx = fx * iy + rx * ix, mz = fz * iy + rz * ix, sp = 9 * Math.min(1, len);
    player.position.x += mx * sp * dt; player.position.z += mz * sp * dt;
    let d = Math.atan2(mx, mz) - player.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d));
    player.rotation.y += d * Math.min(1, dt * 12);
    u.walk += dt * 11;
  }
  u.amp += ((moving ? 0.75 : 0) - u.amp) * Math.min(1, dt * 10);
  swing(player, u.amp, u.walk);
  const p = player.position;
  if (S.world === 'area') { areaCollide(p); return; }
  zones.forEach(z => {
    const dx = p.x - z.pos.x, dz = p.z - z.pos.z, d = Math.hypot(dx, dz);
    if (d < 6.3 && d > 0.001) { p.x = z.pos.x + dx / d * 6.3; p.z = z.pos.z + dz / d * 6.3; }
  });
  const dc = Math.hypot(p.x, p.z);
  if (dc < 3.3) { if (dc < 0.001) p.z = 3.3; else { p.x = p.x / dc * 3.3; p.z = p.z / dc * 3.3; } }
  if (dc > 78) { p.x = p.x / dc * 78; p.z = p.z / dc * 78; }
}

function updateCamera(t, dt) {
  if (S.mode === 'play' && player) {
    const tg = new THREE.Vector3(player.position.x, 1.8, player.position.z), pitch = 0.5, dist = 15;
    const want = new THREE.Vector3(tg.x + Math.sin(camYaw) * Math.cos(pitch) * dist, tg.y + Math.sin(pitch) * dist, tg.z + Math.cos(camYaw) * Math.cos(pitch) * dist);
    if (S.snap) { camera.position.copy(want); S.snap = false; } else camera.position.lerp(want, 1 - Math.exp(-dt * 9));
    camera.lookAt(tg);
  } else if (S.mode === 'creator' && player) {
    const portrait = window.innerWidth <= 760, dist = portrait ? 10.5 : 8.2;
    let shift = 0;
    if (!portrait) { const hw = Math.tan(0.48) * dist * camera.aspect, pf = Math.min(400, window.innerWidth) / window.innerWidth; shift = ((pf + (1 - pf) / 2) - 0.5) * 2 * hw; }
    const tx = player.position.x - shift, tz = player.position.z;
    camera.position.set(tx, portrait ? 2.2 : 2.4, tz + dist); camera.lookAt(tx, portrait ? -1.0 : 1.4, tz);
  } else if (S.mode === 'city') {
    const p = 1.0, d = cs.dist, cy = cs.yaw;
    camera.position.set(CITY_CX + Math.sin(cy) * Math.cos(p) * d, Math.sin(p) * d, Math.cos(cy) * Math.cos(p) * d);
    camera.lookAt(CITY_CX, window.innerHeight > window.innerWidth ? -4 : -2, 0);
  } else {
    const a = t * 0.07;
    camera.position.set(Math.cos(a) * 50, 17, Math.sin(a) * 50); camera.lookAt(0, 4, 0);
  }
}

function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (S.mode === 'play' && !S.lock && player) { movePlayer(dt); updateNear(); }
  else if (S.mode === 'play' && player) { swing(player, 0, 0); }
  if (S.mode === 'creator' && player) { player.rotation.y += dt * 0.7; swing(player, 0.05, t * 2); }
  zones.forEach((z, i) => {
    z.marker.position.y = 4.2 + Math.sin(t * 2.2 + i) * 0.25;
    swing(z.npc, 0.06, t * 1.6 + i);
    let tr = Math.atan2(-z.pos.x, -z.pos.z);
    if (player && S.mode === 'play') { const dx = player.position.x - z.npc.position.x, dz = player.position.z - z.npc.position.z; if (Math.hypot(dx, dz) < 12) tr = Math.atan2(dx, dz); }
    let d = tr - z.npc.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); z.npc.rotation.y += d * Math.min(1, dt * 5);
  });
  if (scene.userData.globe) scene.userData.globe.rotation.y = t * 0.5;
  (scene.userData.clouds || []).forEach(c => { c.position.x += dt * 1.2; if (c.position.x > 130) c.position.x = -130; });
  areaAnim.forEach((s, i) => { s.position.y = s.userData.y0 + Math.sin(t * 2 + i) * 0.18; });
  plazaAnim.forEach((s, i) => { s.position.y = s.userData.y0 + Math.sin(t * 2 + i) * 0.18; });
  presenceTick(dt, t);
  if (S.world === 'area' && S.mode === 'play' && !S.lock && player) areaOrbs.forEach(o => { if (!o.got) { o.m.rotation.y += dt * 2; o.m.position.y = 1.2 + Math.sin(t * 3 + o.z) * 0.2; if (Math.hypot(player.position.x - o.x, player.position.z - o.z) < 1.9) collectOrb(o); } });
  updateCamera(t, dt);
  renderer.render(scene, camera);
}

let toastT;

let actx;
function beep(ok) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = 'sine'; o.frequency.setValueAtTime(ok ? 660 : 220, t); if (ok) o.frequency.setValueAtTime(880, t + 0.09);
    g.gain.setValueAtTime(0.07, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.26);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + 0.27);
  } catch (e) {}
}

async function openRanking(tab) {
  tab = tab || 'seccion'; const me = S.me;
  openModal(`${mhead('🏆', 'Ranking')}<div class="mbody"><p class="mute">Cargando…</p></div>`);
  let all = [];
  try { all = await Store.topStudents(tab, me); } catch (e) { console.warn(e); toast('No se pudo leer el ranking.'); }
  const outside = Store.mode === 'online' && !all.some(s => s.id === me.id);
  if (!outside && !all.some(s => s.id === me.id)) all.push(me);
  all = all.map(s => s.id === me.id ? me : s);
  let list = all;
  if (tab === 'seccion') list = all.filter(s => s.grado === me.grado && s.seccion === me.seccion);
  if (tab === 'grado') list = all.filter(s => s.grado === me.grado);
  list = list.slice().sort((a, b) => b.xp - a.xp || precOf(b) - precOf(a));
  const pod = (s, cls, medal) => s ? `<div class="${cls}"><div class="m">${medal}</div><b>${esc(shortName(s))}</b><span class="mute">Nv ${levelOf(s.xp)} · ${s.xp} XP</span></div>` : '<div></div>';

  const rest = list.slice(3, 15).map((s, i) => rk(s, i + 3)).join('');
  const myPos = list.findIndex(s => s.id === me.id);
  const tabs = [['seccion', `Mi sección (${me.grado}° ${me.seccion})`], ['grado', `Mi grado (${me.grado}°)`], ['colegio', 'Todo el colegio']];

async function importRetos(file) {

    if (!ok.length) throw new Error('vacío');
    const ids = new Set(ok.map(r => r.id));
    const merged = S.retos.filter(r => !ids.has(r.id)).concat(ok);
    await Store.replaceRetos(merged); S.retos = merged; toast(ok.length + ' retos cargados.');
  } catch (e) { console.warn(e); toast('El archivo no tiene un formato válido de retos.'); }
}

const cs = { yaw: 0.6, dist: 34, sel: null, moving: null, target: null, tab: 'edif', ghost: null, gx: 0, gz: 0, r: 0, cx: 7, cz: 7, valid: false };
const cityMeshes = new Map();
const PLANE = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), hit = new THREE.Vector3();

const foot = (it, r) => r ? [it.d, it.w] : [it.w, it.d];
const canAfford = it => it.tipo === 'edif' ? (S.me.res[it.area] || 0) >= it.costo : S.me.coins >= it.costo;
function pay(it) { if (it.tipo === 'edif') S.me.res[it.area] -= it.costo; else S.me.coins -= it.costo; }
function occGrid() {
  const o = new Array(CITY_G * CITY_G).fill(-1);
  S.me.city.forEach((rec, i) => {
    const [w, d] = foot(BUILD_BY[rec.t], rec.r);
    for (let a = 0; a < w; a++) for (let b = 0; b < d; b++) o[(rec.z + b) * CITY_G + rec.x + a] = i;
  });
  return o;
}
function placeMesh(g, it, x, z, r) {
  const [w, d] = foot(it, r);
  g.position.set((x + w / 2 - CITY_G / 2) * CELL, 0, (z + d / 2 - CITY_G / 2) * CELL); g.rotation.y = r * Math.PI / 2;
}
function addCityMesh(rec) { const it = BUILD_BY[rec.t], g = new THREE.Group(); it.build(g); placeMesh(g, it, rec.x, rec.z, rec.r); cityRoot.add(g); cityMeshes.set(rec, g); }
function removeCityMesh(rec) { const g = cityMeshes.get(rec); if (g) { cityRoot.remove(g); cityMeshes.delete(rec); } }
function loadCity() {
  cityMeshes.forEach(g => cityRoot.remove(g)); cityMeshes.clear();
  S.me.city = S.me.city.filter(r => BUILD_BY[r.t]);
  S.me.city.forEach(addCityMesh);
}
function cellFromEvent(e) {
  ndc.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (!ray.ray.intersectPlane(PLANE, hit)) return null;
  return { cx: Math.floor((hit.x - CITY_CX) / CELL + CITY_G / 2), cz: Math.floor(hit.z / CELL + CITY_G / 2) };
}

/* ---- vista previa al colocar ---- */
function buildGhost(it) {
  const root = new THREE.Group(), model = new THREE.Group(); it.build(model);
  model.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); o.material.transparent = true; o.material.opacity = 0.65; } });
  const pad = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ color: '#2fbf9b', transparent: true, opacity: 0.5, depthWrite: false }));
  pad.rotation.x = -Math.PI / 2; pad.position.y = 0.09;
  root.add(pad, model); root.userData = { model, pad }; cityRoot.add(root); return root;
}
function dropGhost() { if (cs.ghost) { cityRoot.remove(cs.ghost); cs.ghost = null; } }
function moveGhost(ax, az) {
  const it = BUILD_BY[cs.sel], [w, d] = foot(it, cs.r);
  ax = clamp(ax, 0, CITY_G - w); az = clamp(az, 0, CITY_G - d); cs.gx = ax; cs.gz = az;
  const occ = occGrid(); let ok = true;
  for (let a = 0; a < w && ok; a++) for (let b = 0; b < d && ok; b++) if (occ[(az + b) * CITY_G + ax + a] >= 0) ok = false;
  cs.valid = ok;
  const g = cs.ghost;
  g.position.set((ax + w / 2 - CITY_G / 2) * CELL, 0, (az + d / 2 - CITY_G / 2) * CELL);
  g.userData.model.rotation.y = cs.r * Math.PI / 2;
  g.userData.pad.scale.set(w * CELL, d * CELL, 1);
  g.userData.pad.material.color.set(ok ? '#2fbf9b' : '#e5484d');
}
function ghostToCell(cx, cz) {
  const [w, d] = foot(BUILD_BY[cs.sel], cs.r);
  cs.cx = clamp(cx, 0, CITY_G - 1); cs.cz = clamp(cz, 0, CITY_G - 1);
  moveGhost(cs.cx - Math.floor(w / 2), cs.cz - Math.floor(d / 2));
}
function beginPlace(id, rec) {
  dropGhost(); setTarget(null);
  cs.sel = id; cs.moving = rec || null; cs.r = rec ? rec.r : 0;
  cs.ghost = buildGhost(BUILD_BY[id]);
  if (rec) { cs.cx = rec.x; cs.cz = rec.z; moveGhost(rec.x, rec.z); } else ghostToCell(CITY_G / 2, CITY_G / 2);
  renderCityPanel();
}
function cancelPlacing() {
  if (cs.moving) { S.me.city.push(cs.moving); addCityMesh(cs.moving); }
  dropGhost(); cs.sel = null; cs.moving = null;
}
function rotateGhost() { if (!cs.sel) return; cs.r ^= 1; ghostToCell(cs.cx, cs.cz); }
function placeNow() {
  if (!cs.sel) return;
  if (!cs.valid) { toast('Ahí no cabe. Elige un espacio libre (verde).'); beep(false); return; }
  const it = BUILD_BY[cs.sel], me = S.me; let rec = cs.moving;
  if (!rec) {
    if (!canAfford(it)) { toast('Te faltan recursos para construir esto.'); return; }
    pay(it); rec = { t: it.id, x: cs.gx, z: cs.gz, r: cs.r };
  } else { rec.x = cs.gx; rec.z = cs.gz; rec.r = cs.r; }
  me.city.push(rec); addCityMesh(rec);
  dropGhost(); cs.sel = null; cs.moving = null;
  persist(true); beep(true); toast(it.emoji + ' ¡' + it.nombre + ' construido!');
  renderCityPanel(); updateCityTitle();
}
function setTarget(rec) {
  cs.target = rec || null;
  if (!rec) { selPad.visible = false; return; }
  const [w, d] = foot(BUILD_BY[rec.t], rec.r);
  selPad.position.set((rec.x + w / 2 - CITY_G / 2) * CELL, 0.08, (rec.z + d / 2 - CITY_G / 2) * CELL);
  selPad.scale.set(w * CELL + 0.4, d * CELL + 0.4, 1); selPad.visible = true;
}
function cityTap(e) {
  const c = cellFromEvent(e); if (!c) return;
  const inside = c.cx >= 0 && c.cz >= 0 && c.cx < CITY_G && c.cz < CITY_G;
  if (cs.sel) {
    if (!inside) return;
    const [w, d] = foot(BUILD_BY[cs.sel], cs.r);
    const ax = clamp(c.cx - Math.floor(w / 2), 0, CITY_G - w), az = clamp(c.cz - Math.floor(d / 2), 0, CITY_G - d);
    if (ax === cs.gx && az === cs.gz) placeNow(); else ghostToCell(c.cx, c.cz);
  } else {
    const i = inside ? occGrid()[c.cz * CITY_G + c.cx] : -1;
    setTarget(i >= 0 ? S.me.city[i] : null); renderCityPanel();
  }
}
function hoverGhost(e) { if (!cs.sel || !cs.ghost) return; const c = cellFromEvent(e); if (c) ghostToCell(c.cx, c.cz); }
canvas.addEventListener('wheel', e => { if (S.mode === 'city') { cs.dist = clamp(cs.dist + e.deltaY * 0.02, 16, 50); e.preventDefault(); } }, { passive: false });

const AREA_CX = -400, AREA_R = 78;

function mcqFrom(enun, correct, wrongs, expl, dif) {
  const w = [...new Set(wrongs.map(String))].filter(x => x !== String(correct)).slice(0, 3);
  const opts = shuffle([String(correct), ...w]);
  return { tipo: 'mcq', enunciado: enun, opciones: opts, correcta: opts.indexOf(String(correct)), explicacion: expl, dificultad: dif || 1 };
}
const GEN = {
  'mat|Ecuaciones lineales': () => {

    if (t === 1) return { tipo: 'num', enunciado: `Resuelve: ${a}x = ${a * x}`, correcta: x, explicacion: `Divide ambos lados entre ${a}: x = ${a * x} ÷ ${a} = ${x}.`, dificultad: 1 };
    return { tipo: 'num', enunciado: `Resuelve: ${a}x + ${b} = ${a * x + b}`, correcta: x, explicacion: `Resta ${b}: ${a}x = ${a * x}. Luego divide entre ${a}: x = ${x}.`, dificultad: 2 };

    if (m === 0) return { tipo: 'num', enunciado: `Un triángulo rectángulo tiene catetos de ${a} y ${b}. ¿Cuánto mide la hipotenusa?`, correcta: c, explicacion: `c² = ${a}² + ${b}² = ${a * a} + ${b * b} = ${c * c}, y √${c * c} = ${c}.`, dificultad: 1 };
    if (m === 1) return { tipo: 'num', enunciado: `La hipotenusa mide ${c} y un cateto mide ${a}. ¿Cuánto mide el otro cateto?`, correcta: b, explicacion: `b² = ${c}² − ${a}² = ${c * c} − ${a * a} = ${b * b}, y √${b * b} = ${b}.`, dificultad: 2 };
    return mcqFrom(`Los catetos de un triángulo rectángulo miden ${a} y ${b}. ¿Cuál es su hipotenusa?`, c, [a + b, c + 2, c - 1, Math.abs(b - a), c + 1], `c² = ${a * a} + ${b * b} = ${c * c}, así que c = ${c}.`, 1);
  },

    const q = ri(3, 9), a = ri(1, q - 2), b = ri(1, q - a - 1);

  },
  'ing|Present simple': () => {

function arenaPick(s) {
  const me = S.me, ids = s.areaFilter === 'all' ? AREAS.map(a => a.id) : [s.areaFilter];
  const base = S.retos.filter(r => ids.includes(r.area) && (r.grados || []).includes(me.grado) && (r.bimestre || 1) <= S.bim);
  if (!base.length) return null;
  const maxD = 1 + Math.floor(s.streak / 5), easy = base.filter(r => (r.dificultad || 1) <= maxD), pool0 = easy.length ? easy : base;
  const rc = new Set(me.recent || []), seen = new Set(s.list.map(x => x.id));
  let pool = pool0.filter(r => !seen.has(r.id) && !rc.has(r.id)); if (pool.length < 2) pool = pool0.filter(r => !seen.has(r.id)); if (!pool.length) pool = pool0;
  let r = pick(pool), tries = 0; const last = s.list[s.list.length - 1];
  while (last && r.id === last.id && pool.length > 1 && tries++ < 4) r = pick(pool);
  if (GEN[r.area + '|' + r.tema] && Math.random() < 0.5) return genReto(r.area, r.tema);
  return Object.assign({}, r);
}

/* ---------- ayudas ---------- */
const WORD_RE = /^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ ]{3,16}$/;
const todayKey = () => new Date().toISOString().slice(0, 10);
function daily() { const m = S.me; if (!m.daily || m.daily.d !== todayKey()) m.daily = { d: todayKey(), g: {}, o: {} }; return m.daily; }
const juegosDe = (areaId, tipo) => S.juegos.filter(j => j.tipo === tipo && j.area === areaId && (j.grados || []).includes(S.me.grado) && (j.bimestre || 1) <= S.bim);
function rewardGame(areaId, stars) {
  const me = S.me, d = daily(), n = d.g[areaId] || 0; d.g[areaId] = n + 1;
  const full = n < 5 && stars >= 0;
  const xp = full ? 10 + stars * 5 : 3, rg = full ? (stars >= 2 ? 2 : 1) : 0, coins = full ? 2 + stars : 0;
  me.xp += xp; me.coins += coins; if (rg) me.res[areaId] = (me.res[areaId] || 0) + rg; if (stars >= 0) giveFichas(2);
  persist(true); updateHUD(); return { xp, rg, coins, full };
}
function miniResult(g, emoji, title, stars, lines) {

    ${stars >= 0 ? `<h2 style="text-align:center"><span style="color:#e9a400">${starStr(stars)}</span></h2>` : ''}
    <div class="kpis"><div class="kpi"><b>+${r.xp}</b>XP</div><div class="kpi"><b>+${r.rg} ${RES[g.areaId][0]}</b>${RES[g.areaId][1]}</div><div class="kpi"><b>+${r.coins}</b>🪙</div></div>
    ${lines.map(t => `<div class="say">${t}</div>`).join('')}
    ${r.full ? '' : '<div class="say">Hoy ya jugaste mucho en esta área: la recompensa baja, pero practicar siempre suma.</div>'}

    <div class="row"><button class="btn" data-m="mgagain" data-g="${g.type}" data-a="${g.areaId}">Jugar otra vez</button><button class="btn mint" data-m="close">Seguir explorando</button></div></div>`, { color: a.color });

}
function startMini(kind, areaId) {

const starsByErrors = e => e === 0 ? 3 : e <= 2 ? 2 : e <= 4 ? 1 : 0;

/* ---------- Memoria ---------- */
function startMemoria(areaId) {

  const set = pick(sets), pairs = shuffle(set.items).slice(0, 6);

  const g = S.mg, a = areaById(g.areaId);

function mgCard(i) {

/* ---------- Palabra secreta ---------- */
const baseCh = c => c.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
function startPalabra(areaId) {
  const items = juegosDe(areaId, 'pares').flatMap(j => j.items).filter(p => WORD_RE.test(p[0]));
  if (!items.length) { toast('El docente aún no cargó este juego.'); return; }
  const p = pick(items);
  S.mg = { type: 'palabra', areaId, word: p[0], clue: p[1], guessed: new Set(), wrong: 0, max: 6, lv0: levelOf(S.me.xp) };
  renderPalabra();
}
function renderPalabra() {
  const g = S.mg, a = areaById(g.areaId);
  const shown = [...g.word].map(c => c === ' ' ? '&nbsp;&nbsp;' : g.guessed.has(baseCh(c)) ? esc(c.toUpperCase()) : '_').join(' ');
  const keys = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(k => `<button class="btn sm ${g.guessed.has(k) ? 'alt' : ''}" style="width:40px;padding:6px 0" data-m="mgK" data-k="${k}" ${g.guessed.has(k) ? 'disabled' : ''}>${k}</button>`).join('');
  openModal(`${mhead('🔤', 'Palabra secreta')}<div class="mbody"><div class="enun" style="text-align:center;letter-spacing:3px;font-family:var(--display);font-size:32px;word-break:break-word">${shown}</div><div class="say">Pista: ${esc(g.clue)}</div><div style="text-align:center;font-size:20px">${'❤️'.repeat(g.max - g.wrong)}${'🖤'.repeat(g.wrong)}</div><div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center">${keys}</div></div>`, { color: a.color });
}
function mgKey(k) {
  const g = S.mg; if (!g || g.guessed.has(k)) return;
  g.guessed.add(k);
  const letters = [...g.word].filter(c => c !== ' ').map(baseCh);
  if (letters.includes(k)) beep(true); else { g.wrong++; beep(false); }
  const win = letters.every(l => g.guessed.has(l));
  if (win || g.wrong >= g.max) {
    const line = (win ? '¡Adivinaste! ' : 'La palabra era: ') + '<b>' + esc(g.word) + '</b> — ' + esc(g.clue);
    miniResult(g, win ? '🔤' : '💭', 'Palabra secreta', win ? (g.wrong <= 1 ? 3 : g.wrong <= 3 ? 2 : 1) : -1, [line]);
    return;
  }
  renderPalabra();
}

function buildPark(root, areaId, a, blds) {
  const grade = S.me.grado, pares = juegosDe(areaId, 'pares'), sec = juegosDe(areaId, 'secuencia');
  const hasWords = pares.some(j => j.items.some(p => WORD_RE.test(p[0])));
  const hasRetos = S.retos.some(r => r.area === areaId && (r.grados || []).includes(grade) && (r.bimestre || 1) <= S.bim);
  const PARK = [['pares', '🔗', 'Relacionar', pares.length > 0], ['memoria', '🃏', 'Memoria', pares.length > 0], ['palabra', '🔤', 'Palabra', hasWords], ['orden', '🔢', 'Ordenar', sec.length > 0], ['reloj', '⏱️', 'Reloj', hasRetos]];
  PARK.forEach(([id, emoji, label, ok], i) => {
    const ang = (i / PARK.length) * Math.PI * 2 + 0.55, x = Math.cos(ang) * 17, z = Math.sin(ang) * 17;
    const st = new THREE.Group(); st.position.set(x, 0, z); root.add(st);
    cyl(st, 1.0, 1.1, 0.8, ok ? a.color : '#9ca3af', 0, 0, 0, 14); bx(st, 1.7, 0.25, 1.7, '#ffffff', 0, 0.8, 0);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: stationTexture(ok ? emoji : '🔒', label, !ok) }));
    sp.scale.set(2.5, 2.03, 1); sp.position.set(0, 2.6, 0); sp.userData.y0 = 2.6; st.add(sp); areaAnim.push(sp);
    areaCols.push({ x: AREA_CX + x, z, r: 1.2 });
    areaItems.push({ key: 'park-' + id, x: AREA_CX + x, z, r: 2.8, label: ok ? emoji + ' ' + label + ' · parque de juegos' : '🔒 ' + label, use: () => ok ? startMini(id, areaId) : toast('El docente aún no cargó este juego para tu grado y bimestre.') });
  });
  areaOrbs = [];
  const n = Math.max(0, 12 - (daily().o[areaId] || 0));
  for (let i = 0; i < n; i++) {
    let x = 0, z = 0, tries = 0;
    do { const ang = Math.random() * Math.PI * 2, rr = 12 + Math.random() * 60; x = Math.cos(ang) * rr; z = Math.sin(ang) * rr; tries++; }
    while (tries < 25 && blds.some(b => Math.hypot(b.x - AREA_CX - x, b.z - z) < 8));
    const m = new THREE.Mesh(new THREE.OctahedronGeometry(0.7), new THREE.MeshBasicMaterial({ color: a.color }));
    m.position.set(x, 1.2, z); root.add(m); areaOrbs.push({ m, x: AREA_CX + x, z, got: false });
  }
}

/* ---------- almacenamiento de equipos ---------- */
Object.assign(Store, {
  _ticks: new Set(),
  _tk() { return this._get('ms_teams', {}); },
  _tnotify() { this._ticks.forEach(f => f()); },
  async teamGet(code) {
    if (this.mode === 'online') { const d = await this.db.collection('teams').doc(code).get(); return d.exists ? d.data() : null; }
    return this._tk()[code] || null;
  },
  async teamCreate(team) {
    if (this.mode === 'online') return this.db.collection('teams').doc(team.code).set(team);
    const o = this._tk(); o[team.code] = team; this._set('ms_teams', o); this._tnotify();
  },
  /* fn(team) puede devolver {error} o {delete:true}; devuelve {team} o {error} */
  async _teamMut(code, fn) {
    if (this.mode === 'online') {
      const ref = this.db.collection('teams').doc(code); let err = null, del = false, out = null;
      await this.db.runTransaction(async tx => {
        const s = await tx.get(ref); if (!s.exists) { err = 'No existe un equipo con ese código.'; return; }
        const t = s.data(), r = fn(t);
        if (r && r.error) { err = r.error; return; }
        if (r && r.delete) { del = true; return; }
        tx.set(ref, t); out = t;
      });
      if (err) return { error: err };
      if (del) await ref.delete();
      return { team: out };
    }
    const o = this._tk(), t = o[code]; if (!t) return { error: 'No existe un equipo con ese código.' };
    const r = fn(t); if (r && r.error) return { error: r.error };
    if (r && r.delete) delete o[code]; else o[code] = t;
    this._set('ms_teams', o); this._tnotify(); return { team: t };
  },
  async teamPatch(code, patch) {
    if (this.mode === 'online') return this.db.collection('teams').doc(code).update(patch);
    const o = this._tk(), t = o[code]; if (!t) return; Object.entries(patch).forEach(([p, v]) => setPath(t, p, v));
    this._set('ms_teams', o); this._tnotify();
  },
  teamWatch(code, cb) {
    if (this.mode === 'online') return this.db.collection('teams').doc(code).onSnapshot(s => cb(s.exists ? s.data() : null), e => console.warn(e));
    let last = '';
    const tick = () => { const t = this._tk()[code] || null, j = JSON.stringify(t); if (j !== last) { last = j; cb(t ? JSON.parse(j) : null); } };
    this._ticks.add(tick); tick(); const iv = setInterval(tick, 1200);
    return () => { clearInterval(iv); this._ticks.delete(tick); };
  },
  async teamsAll() {
    if (this.mode === 'online') { const snap = await this.db.collection('teams').get(); return snap.docs.map(d => d.data()); }
    return Object.values(this._tk());
  },
  async teamDelete(code) {
    if (this.mode === 'online') return this.db.collection('teams').doc(code).delete();
    const o = this._tk(); delete o[code]; this._set('ms_teams', o); this._tnotify();
  }
});

function buildTeamQs(areaId, n) {
  const base = shuffle(S.retos.filter(r => r.area === areaId && (r.grados || []).includes(S.me.grado) && (r.bimestre || 1) <= S.bim));
  if (!base.length) return null;
  const qs = [];
  for (let i = 0; i < base.length && qs.length < n; i++) {
    const r = base[i], hasGen = !!GEN[r.area + '|' + r.tema];
    qs.push(hasGen && Math.random() < 0.35 ? genReto(r.area, r.tema) : r);
  }
  while (qs.length < n) {
    const t = pick(base), hasGen = !!GEN[t.area + '|' + t.tema];
    if (!hasGen) break; qs.push(genReto(t.area, t.tema));
  }
  return qs.map(r => ({ id: r.id, area: r.area, tema: r.tema, tipo: r.tipo, enunciado: r.enunciado, opciones: r.opciones || null, correcta: r.correcta, explicacion: r.explicacion || '', dificultad: r.dificultad || 1, gen: !!r.gen }));
}

/* ---------- filtro de mensajes ---------- */
const Filtro = (() => {
  const strip = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const LEET = { '0': 'o', '1': 'i', '3': 'e', '4': 'a', '5': 's', '7': 't', '@': 'a', '$': 's' };
  const INS = new Set(('puta putas puto putos putita putamadre mierda mierdas carajo conchatumadre conchadetumadre concha conchudo ctm ctmre csm huevon huevona huevones weon weona aweonao ' +
    'cojudo cojuda cojudez imbecil imbeciles idiota idiotas estupido estupida tarado tarada mongolo mongola retrasado retrasada subnormal maricon maricones marica cabron cabrona pendejo pendeja ' +
    'gilipollas joder jodete jodido verga pinga polla pene vagina culo culos teta tetas pezon porno porn sexo sexual sexy semen pajero mamada chupala follar violar violacion pedofilo zorra perra ' +
    'malparido hijueputa hdp cagada cagon cagaste asqueroso asquerosa lacra escoria marihuana cocaina pbc droga drogas porro porros nazi').split(' '));
  const ROOTS = ['mierd', 'conchatu', 'idiot', 'imbecil', 'estupid', 'pendej', 'cabron', 'hijuep', 'malpar', 'pedofil', 'asquer', 'putamadr'];
  const APPS = new Set('whatsapp wasap wsp instagram insta tiktok facebook snapchat telegram discord messenger'.split(' '));
  const AMEN = ['te voy a matar', 'te mato', 'matarte', 'muerete', 'suicidate', 'ojala te mueras', 'te voy a pegar', 'te voy a golpear', 'te voy a cortar'];
  const RIESGO = ['suicid', 'matarme', 'quitarme la vida', 'cortarme las venas', 'quiero morir', 'quiero morirme', 'no quiero vivir', 'mejor muerto', 'mejor muerta', 'desaparecer para siempre'];
  const col = (w, n) => w.replace(/(.)\1{2,}/g, (m, c) => c.repeat(n));
  const bad = t => [t, col(t, 1), col(t, 2)].some(v => INS.has(v) || ROOTS.some(r => v.startsWith(r)));
  function words(text) {
    let s = strip(text).replace(/[a-z0-9@$]+/g, w => /[a-z]/.test(w) ? w.replace(/[013457@$]/g, c => LEET[c]) : w);
    s = s.replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
    const toks = s ? s.split(' ') : [], extra = []; let run = [];
    toks.concat(['']).forEach(t => { if (t.length === 1 && /[a-z]/.test(t)) run.push(t); else { if (run.length >= 3) extra.push(run.join('')); run = []; } });
    return { s, toks: toks.concat(extra) };
  }
  function check(text) {
    const raw = String(text || '').trim();
    if (!raw) return { ok: false, tipo: 'vacio' };
    if (raw.length > 120) return { ok: false, tipo: 'largo' };
    if (/(\d[\s.\-]*){7,}/.test(raw) || /[a-z0-9._%+-]+\s*@\s*[a-z0-9.-]+/i.test(raw) || /@/.test(raw) || /(https?:\/\/|www\.|\.com\b|\.pe\b|\.net\b|\.org\b|bit\.ly|\.me\/)/i.test(raw)) return { ok: false, tipo: 'contacto' };
    const w = words(raw);
    if (AMEN.some(p => w.s.includes(p))) return { ok: false, tipo: 'amenaza' };
    if (RIESGO.some(p => w.s.includes(p))) return { ok: false, tipo: 'riesgo' };
    if (w.toks.some(t => APPS.has(t))) return { ok: false, tipo: 'contacto' };
    if (w.toks.some(bad)) return { ok: false, tipo: 'insulto' };
    return { ok: true };
  }
  return { check };
})();

/* ---------- transporte en vivo ---------- */
const pget = (t, path) => path.split('/').filter(Boolean).reduce((o, k) => (o && typeof o === 'object') ? o[k] : undefined, t);
function pset(t, path, v) {
  const ks = path.split('/').filter(Boolean); let o = t;
  ks.slice(0, -1).forEach(k => { if (typeof o[k] !== 'object' || o[k] === null) o[k] = {}; o = o[k]; });
  if (v === null || v === undefined) delete o[ks[ks.length - 1]]; else o[ks[ks.length - 1]] = v;
}
const liveId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const LiveRT = {
  r: p => Store.rtdb.ref(p),
  async get(p) { const s = await LiveRT.r(p).get(); return s.val(); },
  set: (p, v) => LiveRT.r(p).set(v),
  update: (p, v) => LiveRT.r(p).update(v),
  remove: p => LiveRT.r(p).remove(),
  async push(p, v) { const r = LiveRT.r(p).push(); await r.set(v); return r.key; },
  incr: (p, n) => LiveRT.r(p).transaction(x => (x || 0) + n),
  onChild(p, limit, cb) {
    let q = LiveRT.r(p); if (limit) q = q.orderByChild('t').limitToLast(limit);
    const fa = s => cb.added && cb.added(s.key, s.val()), fc = s => cb.changed && cb.changed(s.key, s.val()), fr = s => cb.removed && cb.removed(s.key);
    q.on('child_added', fa); q.on('child_changed', fc); q.on('child_removed', fr);
    return () => { q.off('child_added', fa); q.off('child_changed', fc); q.off('child_removed', fr); };
  },
  onValue(p, cb) { const r = LiveRT.r(p), f = s => cb(s.val()); r.on('value', f); return () => r.off('value', f); },
  onDisc: p => LiveRT.r(p).onDisconnect().remove()
};
const LiveLocal = {
  ls: [], disc: [], iv: null,
  _t() { try { return JSON.parse(localStorage.getItem('ms_live')) || {}; } catch (e) { return {}; } },
  _save(t) { try { localStorage.setItem('ms_live', JSON.stringify(t)); } catch (e) {} },
  async get(p) { const v = pget(this._t(), p); return v === undefined ? null : JSON.parse(JSON.stringify(v)); },
  async set(p, v) { const t = this._t(); pset(t, p, v === undefined ? null : v); this._save(t); this._check(); },
  async update(p, patch) { const t = this._t(); Object.entries(patch).forEach(([k, v]) => pset(t, p + '/' + k, v)); this._save(t); this._check(); },
  async remove(p) { return this.set(p, null); },
  async push(p, v) { const id = liveId(); await this.set(p + '/' + id, v); return id; },
  async incr(p, n) { const v = (await this.get(p)) || 0; return this.set(p, v + n); },
  onDisc(p) { this.disc.push(p); },
  _children(p, limit) {
    let cur = pget(this._t(), p); cur = (cur && typeof cur === 'object') ? cur : {};
    if (!limit) return cur;
    const ks = Object.keys(cur).sort((a, b) => ((cur[a] && cur[a].t) || 0) - ((cur[b] && cur[b].t) || 0)).slice(-limit), out = {}; ks.forEach(k => { out[k] = cur[k]; }); return out;
  },
  _add(l) { this.ls.push(l); if (!this.iv) this.iv = setInterval(() => this._check(), 700); this._check(); return () => { this.ls = this.ls.filter(x => x !== l); if (!this.ls.length) { clearInterval(this.iv); this.iv = null; } }; },
  onChild(p, limit, cb) { return this._add({ kind: 'child', p, limit, cb, last: {} }); },
  onValue(p, cb) { return this._add({ kind: 'value', p, cb, last: undefined }); },
  _check() {
    this.ls.slice().forEach(l => {
      if (l.kind === 'value') { const v = pget(this._t(), l.p), j = JSON.stringify(v === undefined ? null : v); if (j !== l.last) { l.last = j; l.cb(v === undefined ? null : JSON.parse(j)); } return; }
      const cur = this._children(l.p, l.limit), last = l.last, snap = {};
      Object.keys(cur).forEach(k => { const j = JSON.stringify(cur[k]); snap[k] = j; if (!(k in last)) l.cb.added && l.cb.added(k, JSON.parse(j)); else if (last[k] !== j) l.cb.changed && l.cb.changed(k, JSON.parse(j)); });
      Object.keys(last).forEach(k => { if (!(k in snap)) l.cb.removed && l.cb.removed(k); });
      l.last = snap;
    });
  }
};
window.addEventListener('pagehide', () => { try { LiveLocal.disc.forEach(p => { const t = LiveLocal._t(); pset(t, p, null); LiveLocal._save(t); }); } catch (e) {} });
const Live = {
  get mode() { return Store.mode === 'online' ? (Store.rtdb ? 'rtdb' : 'none') : 'local'; },
  get on() { return this.mode !== 'none'; },
  _b() { return this.mode === 'rtdb' ? LiveRT : LiveLocal; },
  get(p) { return this._b().get(p); }, set(p, v) { return this._b().set(p, v); }, update(p, v) { return this._b().update(p, v); },
  remove(p) { return this._b().remove(p); }, push(p, v) { return this._b().push(p, v); }, incr(p, n) { return this._b().incr(p, n); },
  onChild(p, limit, cb) { return this._b().onChild(p, limit, cb); }, onValue(p, cb) { return this._b().onValue(p, cb); }, onDisc(p) { return this._b().onDisc(p); }
};

async function chatBlocked(r, text) {

async function chatSend(raw, quick) {
  const me = S.me, text = String(raw || '').trim().replace(/\s+/g, ' '), now = Date.now(), cfg = chatCfg();

  if (!Chat.ch) { toast('Elige un canal para escribir.'); return; }
  if (now < Chat.muteUntil) { toast('Estás en silencio hasta las ' + hhmm(Chat.muteUntil) + '.'); return; }
  if (now - Chat.last < 2000) { toast('Espera un momento antes de escribir otra vez.'); return; }
  const day = (me.chatDay && me.chatDay.d === todayKey()) ? me.chatDay : (me.chatDay = { d: todayKey(), n: 0 });
  if (day.n >= CHAT_DAY) { toast('Llegaste al límite de mensajes de hoy.'); return; }
  const usar = cfg.fichas !== false && !quick;
  if (usar) {
    const max = chatLimit();
    if (text.length > max) { toast('Tu mensaje pasa de ' + max + ' letras. Puedes desbloquear los mensajes largos en 💬 Fichas.'); return; }

/* =====================================================================
   BATALLAS ENTRE EQUIPOS
   Dos equipos responden las mismas preguntas a la vez. Cada acierto daña
   al rival (según la proporción de aciertos del equipo). Gana el equipo que
   deja al otro sin vida o el que tenga más vida al terminar las preguntas.
   ===================================================================== */
const BT_HP = 100, BT_SECS = 30;
Object.assign(Store, {
  _dk(col) { return this._get('ms_' + col, {}); },
  async dGet(col, id) {
    if (this.mode === 'online') { const d = await this.db.collection(col).doc(id).get(); return d.exists ? d.data() : null; }
    return this._dk(col)[id] || null;
  },
  async dSet(col, id, v) {
    if (this.mode === 'online') return this.db.collection(col).doc(id).set(v);
    const o = this._dk(col); o[id] = v; this._set('ms_' + col, o); this._tnotify();
  },
  async dMut(col, id, fn) {
    if (this.mode === 'online') {
      const ref = this.db.collection(col).doc(id); let err = null, out = null;
      await this.db.runTransaction(async tx => {
        const s = await tx.get(ref); if (!s.exists) { err = 'No existe.'; return; }
        const t = s.data(), r = fn(t); if (r && r.error) { err = r.error; return; }
        tx.set(ref, t); out = t;
      });
      return err ? { error: err } : { data: out };
    }
    const o = this._dk(col), t = o[id]; if (!t) return { error: 'No existe.' };
    const r = fn(t); if (r && r.error) return { error: r.error };
    o[id] = t; this._set('ms_' + col, o); this._tnotify(); return { data: t };
  },
  async dPatch(col, id, patch) {
    if (this.mode === 'online') return this.db.collection(col).doc(id).update(patch);
    const o = this._dk(col), t = o[id]; if (!t) return;
    Object.entries(patch).forEach(([p, v]) => setPath(t, p, v)); this._set('ms_' + col, o); this._tnotify();
  },
  dWatch(col, id, cb) {
    if (this.mode === 'online') return this.db.collection(col).doc(id).onSnapshot(s => cb(s.exists ? s.data() : null), e => console.warn(e));
    let last = ''; const tick = () => { const t = this._dk(col)[id] || null, j = JSON.stringify(t); if (j !== last) { last = j; cb(t ? JSON.parse(j) : null); } };
    this._ticks.add(tick); tick(); const iv = setInterval(tick, 1000);
    return () => { clearInterval(iv); this._ticks.delete(tick); };
  },
  async dOpen(col) {
    if (this.mode === 'online') { const snap = await this.db.collection(col).where('estado', '==', 'esperando').limit(20).get(); return snap.docs.map(d => d.data()); }
    return Object.values(this._dk(col)).filter(b => b.estado === 'esperando');
  },
  async dAll(col) { if (this.mode === 'online') { const snap = await this.db.collection(col).get(); return snap.docs.map(d => d.data()); } return Object.values(this._dk(col)); },
  async dDelete(col, id) {
    if (this.mode === 'online') return this.db.collection(col).doc(id).delete();
    const o = this._dk(col); delete o[id]; this._set('ms_' + col, o); this._tnotify();
  }
});
